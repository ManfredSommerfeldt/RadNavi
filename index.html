<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171a">
<title>Rad-Navi – GPX-Navigation</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  :root{
    --asphalt:#14171a;
    --panel:#1c2024;
    --panel-raised:#23282c;
    --sign-yellow:#f2c14e;
    --route-green:#4f9d69;
    --warn-red:#e2543f;
    --text:#eef0ee;
    --text-dim:#8b938c;
    --line:#2c3236;
  }
  body.theme-day{
    --asphalt:#eef1f0;
    --panel:#ffffff;
    --panel-raised:#f2f4f3;
    --sign-yellow:#b9790f;
    --route-green:#2f7d4d;
    --warn-red:#c23a28;
    --text:#1b1e1f;
    --text-dim:#5b625d;
    --line:#dfe3e1;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--asphalt);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    overflow:hidden;
  }
  #app{height:100vh; height:100dvh; display:flex; flex-direction:column;}

  /* --- Top bar --- */
  #topbar{
    display:flex; align-items:center; gap:10px;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
    z-index:1000;
  }
  #topbar h1{
    font-size:15px; font-weight:800; letter-spacing:0.04em; text-transform:uppercase;
    margin:0; color:var(--sign-yellow); white-space:nowrap;
  }
  .spacer{flex:1;}
  .btn{
    appearance:none; border:none; border-radius:8px;
    padding:9px 14px; font-size:13px; font-weight:700;
    letter-spacing:0.02em; cursor:pointer; white-space:nowrap;
  }
  .btn-primary{background:var(--sign-yellow); color:#221a06;}
  .btn-primary:disabled{background:#4a4536; color:#77715c; cursor:not-allowed;}
  .btn-ghost{background:var(--panel-raised); color:var(--text);}
  .btn-danger{background:var(--warn-red); color:#2a0a05;}
  #fileLabel{
    background:var(--panel-raised); color:var(--text);
    border:1px dashed var(--line); border-radius:8px;
    padding:8px 12px; font-size:12.5px; cursor:pointer;
    max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  #fileInput{display:none;}
  #routeProfile{
    background:var(--panel-raised); color:var(--text);
    border:1px solid var(--line); border-radius:8px;
    padding:8px 6px; font-size:12px; max-width:92px;
  }

  /* --- Map --- */
  #mapWrap{flex:1; position:relative; min-height:0;}
  #map{position:absolute; inset:0; background:#0f1114;}
  .leaflet-control-zoom{margin-top:calc(10px + env(safe-area-inset-top)) !important;}

  /* --- Map overlays (banner / download / turn) ---
     These always sit on a fixed dark card over the map, in both themes, so their
     colors are hardcoded rather than tied to --text/--text-dim/--sign-yellow —
     those flip to dark values in the light day theme and would be unreadable here. */
  #banner, #downloadPanel, #turnBanner{
    position:absolute; top:10px; left:10px; right:10px;
    background:rgba(28,32,36,0.96);
    color:#eef0ee; border-radius:10px;
    font-size:13px; display:none;
  }
  #banner{ border:1px solid #e2543f; padding:10px 12px; line-height:1.4; z-index:900; }
  #banner.show{display:block;}
  #banner strong{color:#ff9a8a;}

  #downloadPanel{ border:1px solid #f2c14e; padding:12px; z-index:950; }
  #downloadPanel.show{display:block;}
  #downloadText{margin-bottom:8px; font-weight:700;}
  #downloadBarTrack{height:6px; border-radius:3px; background:#2c3236; overflow:hidden; margin-bottom:10px;}
  #downloadBarFill{height:100%; width:0%; background:#f2c14e;}

  #turnBanner{ border:1px solid #f2c14e; padding:10px 14px; align-items:center; gap:14px; z-index:910; }
  #turnBanner.show{display:flex;}
  #turnArrowIcon{width:34px; height:34px; flex-shrink:0; color:#f2c14e; transition:transform 0.3s ease;}
  #turnBannerDist{font-size:20px; font-weight:800; line-height:1.1;}
  #turnBannerLabel{font-size:12px; color:#a9b0aa; text-transform:uppercase; letter-spacing:0.04em;}

  /* --- Named-route search panel --- */
  #routeSearchPanel{
    position:absolute; top:10px; left:10px; right:10px; z-index:960;
    background:rgba(28,32,36,0.98); border:1px solid #f2c14e; border-radius:10px;
    display:none; max-height:70%; flex-direction:column; overflow:hidden;
  }
  #routeSearchPanel.show{display:flex;}
  #routeSearchHeader{display:flex; gap:8px; padding:10px;}
  #routeSearchInput{
    flex:1; min-width:0; background:#23282c; color:#eef0ee;
    border:1px solid #2c3236; border-radius:8px; padding:9px 12px; font-size:14px;
  }
  #routeSearchResults{overflow-y:auto; padding:0 10px 10px;}
  .route-search-item{
    padding:10px 8px; border-top:1px solid #2c3236; color:#eef0ee;
    font-size:13.5px; cursor:pointer; display:flex; justify-content:space-between; gap:10px;
  }
  .route-search-item span{color:#a9b0aa; white-space:nowrap;}
  .route-search-status{padding:10px 8px; color:#a9b0aa; font-size:13px;}

  /* --- Floating controls on map --- */
  #mapControls{
    position:absolute; right:10px; bottom:12px; z-index:900;
    display:flex; flex-direction:column; gap:8px;
  }
  .fab{
    width:44px; height:44px; border-radius:50%;
    background:var(--panel-raised); border:1px solid var(--line);
    color:var(--text); font-size:18px; display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .fab.active{background:var(--sign-yellow); color:#221a06; border-color:var(--sign-yellow);}
  #offlineBtn{display:none;}

  .nav-toggle-start{background:var(--route-green); color:#0c2015;}
  .nav-toggle-stop{background:var(--warn-red); color:#2a0a05;}
  #navToggleBtn{
    margin-left:auto; align-self:flex-start; border:none; cursor:pointer;
    padding:2px 18px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    font-size:40px; font-weight:800; letter-spacing:-0.01em; line-height:1;
  }

  /* --- User marker --- */
  .user-dot{
    width:16px; height:16px; border-radius:50%;
    background:var(--sign-yellow); border:3px solid #fff;
    box-shadow:0 0 0 7px rgba(242,193,78,0.28);
  }
  .user-arrow{
    width:0; height:0;
    border-left:8px solid transparent; border-right:8px solid transparent;
    border-bottom:16px solid var(--sign-yellow);
    filter:drop-shadow(0 0 4px rgba(0,0,0,0.5));
  }
  .wpt-pin{
    background:var(--panel-raised); color:var(--sign-yellow);
    border:2px solid var(--sign-yellow); border-radius:50% 50% 50% 0;
    width:22px; height:22px; transform:rotate(-45deg);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800;
  }
  .wpt-pin span{transform:rotate(45deg);}

  /* --- Dashboard --- */
  #dashboard{
    background:var(--panel); border-top:1px solid var(--line);
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    display:none; z-index:1000;
    max-height:48vh; overflow-y:auto;
  }
  #dashboard.show{display:block;}
  /* While actively navigating, keep the panel small so the map stays visible;
     the topbar (file/profile pickers, not needed mid-ride) is hidden entirely. */
  body.nav-active #topbar{display:none;}
  body.nav-active #dashboard{max-height:26vh;}
  #placeholder{
    padding:16px; text-align:center; color:var(--text-dim); font-size:13px;
  }
  #placeholder.hide{display:none;}
  #routeHeader{display:none;}
  #routeHeader.show{display:block;}
  #routeSummary{display:none;}
  #routeSummary.show{display:block;}
  .stat-row{display:flex; align-items:flex-end; gap:22px; margin-bottom:10px;}
  .stat-row2{display:flex; gap:26px; margin-bottom:10px;}
  .stat-main .stat-value{font-size:40px; font-weight:800; letter-spacing:-0.01em; line-height:1;}
  .stat-main .stat-label{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; margin-top:2px;}
  .stat-sub{display:flex; flex-direction:column; align-items:flex-start;}
  .stat-sub .stat-value{font-size:18px; font-weight:700;}
  .stat-sub .stat-label{font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em;}

  #tripSummary{display:none;}
  #tripSummary.show{display:block;}

  #nextWpt{
    font-size:12.5px; color:var(--text-dim); margin-bottom:10px; min-height:16px;
  }
  #nextWpt b{color:var(--text);}

  /* --- Elevation profile --- */
  #elevPanel{margin-bottom:10px; display:none;}
  #elevPanel.show{display:block;}
  #elevHeader{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em;
    margin-bottom:4px;
  }
  #elevStats{font-size:11px; color:var(--text-dim); text-transform:none; letter-spacing:0;}
  #elevSvg{width:100%; height:54px; display:block;}
  #elevPath{fill:none; stroke:var(--route-green); stroke-width:2;}
  #elevMarker{fill:var(--sign-yellow); stroke:#221a06; stroke-width:1.5; display:none;}

  /* --- Recording / GPX export --- */
  #recordingRow{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-top:10px; font-size:12px; color:var(--text-dim);
  }

  #offRouteBanner{
    display:none; background:rgba(226,84,63,0.15); border:1px solid var(--warn-red);
    color:#ff9a8a; font-size:12.5px; font-weight:700; padding:7px 10px; border-radius:8px;
    margin-bottom:10px;
  }
  #offRouteBanner.show{display:block;}

  /* --- Recording opt-in toggle --- */
  #recordToggleRow{
    display:flex; align-items:center; gap:8px; margin-bottom:10px;
    font-size:13px; color:var(--text-dim);
  }
  #recordToggleRow input[type=checkbox]{
    width:18px; height:18px; accent-color:var(--sign-yellow);
  }

</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <h1>Rad-Navi</h1>
    <div class="spacer"></div>
    <select id="routeProfile" title="Routing-Profil für berechnete Routen">
      <option value="trekking" selected>Standard</option>
      <option value="fastbike">Schnell</option>
      <option value="safety">Ruhig</option>
      <option value="shortest">Kürzeste</option>
    </select>
    <label id="fileLabel" for="fileInput">GPX laden…</label>
    <input type="file" id="fileInput" accept=".gpx">
  </div>

  <div id="mapWrap">
    <div id="map"></div>

    <div id="banner"></div>

    <div id="turnBanner">
      <svg id="turnArrowIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M12 4 L12 20 M12 4 L6 10 M12 4 L18 10" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <div id="turnBannerDist">–</div>
        <div id="turnBannerLabel">–</div>
      </div>
    </div>

    <div id="downloadPanel">
      <div id="downloadText">Kacheln werden geladen… 0 / 0</div>
      <div id="downloadBarTrack"><div id="downloadBarFill"></div></div>
      <button class="btn btn-ghost" id="cancelDownloadBtn">Abbrechen</button>
    </div>

    <div id="routeSearchPanel">
      <div id="routeSearchHeader">
        <input type="text" id="routeSearchInput" placeholder="z. B. Ruhrtalradweg, RS1…">
        <button class="btn btn-ghost" id="routeSearchCloseBtn">✕</button>
      </div>
      <div id="routeSearchResults"></div>
    </div>

    <div id="mapControls">
      <div class="fab active" id="followBtn" title="Karte folgt Position">◎</div>
      <div class="fab" id="fitBtn" title="Ganze Route zeigen">⤢</div>
      <div class="fab" id="routeBtn" title="Ziel auf der Karte wählen und Route berechnen">🎯</div>
      <div class="fab" id="namedRouteBtn" title="Bekannte Radroute suchen (z. B. Ruhrtalradweg, RS1)">🔍</div>
      <div class="fab" id="offlineBtn" title="Karte für Route offline speichern">📥</div>
    </div>
  </div>

  <div id="dashboard">
    <div id="placeholder">Lade eine GPX-Datei, um die Route auf der Karte zu sehen.</div>

    <div id="routeHeader">
      <div class="stat-row">
        <div class="stat-main">
          <div class="stat-value" id="mainDistance">–</div>
          <div class="stat-label" id="mainDistanceLabel">Streckenlänge</div>
        </div>
        <div class="stat-sub" id="speedStat" style="display:none;">
          <div class="stat-value" id="statSpeed">–</div>
          <div class="stat-label">km/h</div>
        </div>
        <div class="nav-toggle-start" id="navToggleBtn" title="Navigation starten/stoppen">Start</div>
      </div>
    </div>

    <div id="routeSummary">
      <div id="elevPanel">
        <div id="elevHeader"><span>Höhenprofil</span><span id="elevStats"></span></div>
        <svg id="elevSvg" viewBox="0 0 300 54" preserveAspectRatio="none">
          <path id="elevPath" d=""/>
          <circle id="elevMarker" r="4" cx="0" cy="0"/>
        </svg>
      </div>

      <label id="recordToggleRow">
        <input type="checkbox" id="recordToggle">
        <span>⏺ Strecke aufzeichnen (für späteren GPX-Export)</span>
      </label>

      <div id="tripSummary">
        <div class="stat-row2">
          <div class="stat-sub">
            <div class="stat-value" id="statTime">–</div>
            <div class="stat-label">Fahrtzeit</div>
          </div>
          <div class="stat-sub">
            <div class="stat-value" id="statAvgSpeed">–</div>
            <div class="stat-label">Ø km/h</div>
          </div>
        </div>
        <div id="recordingRow">
          <span id="recordingInfo">Aufzeichnung: 0 m</span>
          <button class="btn btn-ghost" id="exportBtn" disabled>GPX exportieren</button>
        </div>
      </div>
    </div>

    <div id="navContent" style="display:none;">
      <div id="offRouteBanner">⚠ Du bist <span id="offRouteDist">–</span> von der Route entfernt</div>

      <div id="nextWpt">&nbsp;</div>
    </div>
  </div>

</div>

     where the Wake Lock API is unavailable or doesn't actually work (e.g. Opera). Same
     technique NoSleep.js uses — a barely-visible playing video suppresses screen idle

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js"></script>
<script>
(function(){

  // ---------- Service worker (offline cache for app shell + map tiles) ----------
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }

  // ---------- Night mode (auto by time of day) ----------
  function updateTheme(){
    const hour = new Date().getHours();
    const isDay = hour >= 6 && hour < 20;
    document.body.classList.toggle('theme-day', isDay);
    const meta = document.querySelector('meta[name=theme-color]');
    if(meta) meta.setAttribute('content', isDay ? '#eef1f0' : '#14171a');
  }
  updateTheme();
  setInterval(updateTheme, 5 * 60 * 1000);

  // ---------- Map setup ----------
  // rotate/rotateControl/touchRotate/bearing are provided by the leaflet-rotate plugin
  // (loaded above); if that script fails to load, these options are simply ignored by
  // vanilla Leaflet and the map stays north-up — heading rotation is feature-detected below.
  const map = L.map('map', {
    zoomControl:false, rotate:true, rotateControl:false, touchRotate:false, bearing:0
  }).setView([51.1657, 10.4515], 6);
  L.control.zoom({ position:'topright' }).addTo(map);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19,
    attribution:'&copy; OpenStreetMap contributors'
  }).addTo(map);

  // Mobile browsers (esp. iOS "Add to Home Screen") can settle their viewport
  // height slightly after first paint, leaving Leaflet with a stale container
  // size — keep it in sync so the map isn't broken/blank on first load.
  window.addEventListener('load', () => setTimeout(() => map.invalidateSize(), 300));
  window.addEventListener('resize', () => map.invalidateSize());
  window.addEventListener('orientationchange', () => setTimeout(() => map.invalidateSize(), 300));
  document.addEventListener('fullscreenchange', () => setTimeout(() => map.invalidateSize(), 100));

  let routeLayer = null;
  let wptMarkers = [];
  let trackPoints = [];   // [{lat,lon}]
  let cumDist = [];       // cumulative meters along track
  let totalDist = 0;
  let matchedWpts = [];   // [{name, lat, lon, cumDist}]
  let userMarker = null;
  let watchId = null;
  let followMode = true;
  let lastFix = null;
  let lastZoomChange = 0;
  let programmaticZoom = false; // true while WE change the view, so user zoom detection ignores it
  let pickingDestination = false;
  let destMarker = null;
  let lastHeading = 0;

  // Heading-up map rotation (only while actively navigating + auto-follow is on);
  // no-ops if the leaflet-rotate plugin failed to load.
  function setMapBearing(deg){
    if(typeof map.setBearing === 'function') map.setBearing(deg);
  }

  // Fullscreen while navigating, to reclaim the browser chrome for the map too.
  // Not supported everywhere (notably older iOS Safari) — fails silently there.
  function enterFullscreen(){
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if(req) req.call(el).catch(() => {});
  }
  function exitFullscreen(){
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if(exit && (document.fullscreenElement || document.webkitFullscreenElement)) exit.call(document).catch(() => {});
  }

  // Keep the screen from auto-locking while navigating — browsers throttle/pause GPS
  // updates and voice timers heavily once the screen goes dark, so this is the only
  // practical way for a web app (vs. a native background service) to keep guidance live.
  // Doesn't cover a manual power-button press; the visibilitychange listener below
  // re-acquires the lock once the screen comes back on so it recovers from that too.
  //
  // Runs both the real Wake Lock API AND the silent-video fallback at once: some
  // browsers (e.g. Opera) report navigator.wakeLock as supported but don't actually
  // keep the screen on, so feature-detection alone isn't reliable here.
  let wakeLock = null;
  const noSleepVideo = document.getElementById('noSleepVideo');
  async function requestWakeLock(){
    noSleepVideo.play().catch(() => {});
    if('wakeLock' in navigator){
      try{ wakeLock = await navigator.wakeLock.request('screen'); }catch(e){}
    }
  }
  function releaseWakeLock(){
    if(wakeLock){ wakeLock.release().catch(() => {}); wakeLock = null; }
    noSleepVideo.pause();
  }
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible' && navStartTime) requestWakeLock();
  });

  // voice-announcement state (reset per route)
  let wasOffRoute = false;
  let lastOffRouteAnnounce = 0;
  let announcedNear = new Set();
  let announcedClose = new Set();
  let announcedArrival = false;

  // turn-by-turn state (reset per route)
  let turnPoints = [];
  let announcedTurnFar = new Set();
  let announcedTurnNear = new Set();

  // elevation profile state (reset per route)
  let elevProfile = null; // {w,h,minE,maxE}

  // trip timer / GPS-track recording state (reset per nav session)
  let navStartTime = null;
  let tripTimerInterval = null;
  let recordedTrack = [];
  let recordedDistance = 0;
  let lastRecordedPoint = null;
  let recordingEnabled = false; // only records GPX points if opted in before "Start"

  // ---------- Geo helpers ----------
  const toRad = d => d * Math.PI / 180;

  function haversine(a, b){
    const R = 6371000;
    const dLat = toRad(b.lat - a.lat);
    const dLon = toRad(b.lon - a.lon);
    const la1 = toRad(a.lat), la2 = toRad(b.lat);
    const h = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }

  function bearing(a, b){
    const la1 = toRad(a.lat), la2 = toRad(b.lat);
    const dLon = toRad(b.lon - a.lon);
    const y = Math.sin(dLon) * Math.cos(la2);
    const x = Math.cos(la1)*Math.sin(la2) - Math.sin(la1)*Math.cos(la2)*Math.cos(dLon);
    return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  }

  function projectOnSegment(p, a, b){
    const R = 6371000;
    const lat0 = toRad(a.lat);
    const toXY = pt => ({
      x: toRad(pt.lon - a.lon) * Math.cos(lat0) * R,
      y: toRad(pt.lat - a.lat) * R
    });
    const A = {x:0,y:0}, B = toXY(b), P = toXY(p);
    const ABx = B.x - A.x, ABy = B.y - A.y;
    const len2 = ABx*ABx + ABy*ABy;
    let t = len2 === 0 ? 0 : ((P.x-A.x)*ABx + (P.y-A.y)*ABy) / len2;
    t = Math.max(0, Math.min(1, t));
    const cx = A.x + ABx*t, cy = A.y + ABy*t;
    const dist = Math.sqrt((P.x-cx)**2 + (P.y-cy)**2);
    return { t, dist };
  }

  function findNearestOnTrack(p){
    let best = { segIndex:0, t:0, dist:Infinity };
    for(let i = 0; i < trackPoints.length - 1; i++){
      const r = projectOnSegment(p, trackPoints[i], trackPoints[i+1]);
      if(r.dist < best.dist){
        best = { segIndex:i, t:r.t, dist:r.dist };
      }
    }
    const traveled = cumDist[best.segIndex] + best.t * (cumDist[best.segIndex+1] - cumDist[best.segIndex]);
    return { ...best, traveled };
  }

  // Binary search for the segment index i with cumDist[i] <= dist < cumDist[i+1].
  // Long routes (e.g. a 230km named route with 12k+ points) made the old linear
  // scan-from-zero noticeably slow, since computeTurns() calls this ~3x per 15m step.
  function segmentAtDistance(dist){
    let lo = 0, hi = cumDist.length - 1;
    while(hi - lo > 1){
      const mid = (lo + hi) >> 1;
      if(cumDist[mid] <= dist) lo = mid; else hi = mid;
    }
    return lo;
  }

  function pointAtDistance(dist){
    if(dist <= 0) return trackPoints[0];
    if(dist >= totalDist) return trackPoints[trackPoints.length-1];
    const i = segmentAtDistance(dist);
    const segLen = cumDist[i+1] - cumDist[i];
    const t = segLen === 0 ? 0 : (dist - cumDist[i]) / segLen;
    const a = trackPoints[i], b = trackPoints[i+1];
    return { lat: a.lat + (b.lat-a.lat)*t, lon: a.lon + (b.lon-a.lon)*t };
  }

  function fmtDist(m){
    if(m < 0) m = 0;
    return m < 1000 ? Math.round(m / 10) * 10 + ' m' : (m/1000).toFixed(m < 10000 ? 2 : 1) + ' km';
  }

  function computeNavZoom(kmh){
    if(kmh == null) return 17;
    if(kmh < 8) return 18;
    if(kmh < 20) return 17;
    if(kmh < 35) return 16;
    return 15;
  }

  function fmtDuration(ms){
    const totalSec = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    const pad = n => String(n).padStart(2, '0');
    return h > 0 ? h + ':' + pad(m) + ':' + pad(s) : m + ':' + pad(s);
  }

  function elevationAt(dist){
    if(trackPoints.length < 2) return null;
    if(dist <= 0) return trackPoints[0].ele;
    if(dist >= totalDist) return trackPoints[trackPoints.length - 1].ele;
    const i = segmentAtDistance(dist);
    const a = trackPoints[i], b = trackPoints[i+1];
    if(a.ele == null || b.ele == null) return null;
    const segLen = cumDist[i+1] - cumDist[i];
    const t = segLen === 0 ? 0 : (dist - cumDist[i]) / segLen;
    return a.ele + (b.ele - a.ele) * t;
  }

  // Detects turns by comparing the bearing just before / after each point along
  // the track, then merges nearby candidates so one intersection isn't announced twice.
  function computeTurns(){
    const STEP = 15, LOOK = 20, MIN_ANGLE = 25, MERGE_DIST = 40;
    const candidates = [];
    for(let d = LOOK; d <= totalDist - LOOK; d += STEP){
      const before = pointAtDistance(d - LOOK);
      const at = pointAtDistance(d);
      const after = pointAtDistance(d + LOOK);
      const b1 = bearing(before, at);
      const b2 = bearing(at, after);
      let delta = b2 - b1;
      while(delta > 180) delta -= 360;
      while(delta < -180) delta += 360;
      if(Math.abs(delta) >= MIN_ANGLE) candidates.push({ cumDist: d, angle: delta });
    }

    const merged = [];
    candidates.forEach(c => {
      const last = merged[merged.length - 1];
      if(last && c.cumDist - last.cumDist <= MERGE_DIST){
        if(Math.abs(c.angle) > Math.abs(last.angle)) merged[merged.length - 1] = c;
      }else{
        merged.push(c);
      }
    });

    return merged.map(c => {
      const right = c.angle > 0;
      const abs = Math.abs(c.angle);
      const label = abs >= 100 ? (right ? 'scharf rechts' : 'scharf links')
                  : abs >= 55  ? (right ? 'rechts' : 'links')
                  :              (right ? 'leicht rechts' : 'leicht links');
      return { cumDist: c.cumDist, angle: c.angle, label };
    });
  }

  function buildElevationProfile(){
    const path = document.getElementById('elevPath');
    const marker = document.getElementById('elevMarker');
    const panel = document.getElementById('elevPanel');
    const statsEl = document.getElementById('elevStats');

    const elevs = trackPoints.map(p => p.ele).filter(e => e != null);
    if(elevs.length < 2){
      elevProfile = null;
      panel.classList.remove('show');
      marker.style.display = 'none';
      return;
    }

    const w = 300, h = 54, pad = 4;
    const minE = Math.min(...elevs), maxE = Math.max(...elevs);
    const range = Math.max(1, maxE - minE);
    let d = '';
    trackPoints.forEach((p, i) => {
      if(p.ele == null) return;
      const x = (cumDist[i] / totalDist) * w;
      const y = h - pad - ((p.ele - minE) / range) * (h - 2*pad);
      d += (d ? 'L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
    });
    path.setAttribute('d', d);

    let ascent = 0, descent = 0, prevEle = trackPoints[0].ele, smoothed = prevEle;
    for(let i = 1; i < trackPoints.length; i++){
      const e = trackPoints[i].ele;
      if(e == null || prevEle == null) continue;
      smoothed = smoothed * 0.7 + e * 0.3;
      const diff = smoothed - prevEle;
      if(Math.abs(diff) >= 1){
        if(diff > 0) ascent += diff; else descent += -diff;
        prevEle = smoothed;
      }
    }

    statsEl.textContent = '↑ ' + Math.round(ascent) + ' m   ↓ ' + Math.round(descent) + ' m';
    elevProfile = { w, h, pad, minE, range };
    panel.classList.add('show');
  }

  // ---------- Voice (always on) ----------
  function speak(text){
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE';
    window.speechSynthesis.speak(u);
  }

  // ---------- Recording opt-in ----------
  document.getElementById('recordToggle').addEventListener('change', function(){
    recordingEnabled = this.checked;
  });

  // ---------- GPX parsing ----------
  function parseGPX(xmlText){
    const xml = new DOMParser().parseFromString(xmlText, 'application/xml');
    if(xml.querySelector('parsererror')) throw new Error('Ungültige GPX-Datei.');

    let pts = Array.from(xml.querySelectorAll('trkpt'));
    if(pts.length === 0) pts = Array.from(xml.querySelectorAll('rtept'));
    if(pts.length === 0) throw new Error('Keine Track- oder Routenpunkte in dieser Datei gefunden.');

    const points = pts.map(pt => {
      const eleEl = pt.querySelector('ele');
      const ele = eleEl ? parseFloat(eleEl.textContent) : NaN;
      return {
        lat: parseFloat(pt.getAttribute('lat')),
        lon: parseFloat(pt.getAttribute('lon')),
        ele: isNaN(ele) ? null : ele
      };
    });

    const waypoints = Array.from(xml.querySelectorAll('wpt')).map(pt => {
      const nameEl = pt.querySelector('name');
      return {
        lat: parseFloat(pt.getAttribute('lat')),
        lon: parseFloat(pt.getAttribute('lon')),
        name: nameEl ? nameEl.textContent : 'Wegpunkt'
      };
    });

    return { points, waypoints };
  }

  function loadRoute(points, waypoints){
    trackPoints = points;
    cumDist = [0];
    for(let i = 1; i < points.length; i++){
      cumDist.push(cumDist[i-1] + haversine(points[i-1], points[i]));
    }
    totalDist = cumDist[cumDist.length - 1];

    matchedWpts = waypoints.map(w => {
      let bestIdx = 0, bestDist = Infinity;
      trackPoints.forEach((p, i) => {
        const d = haversine(w, p);
        if(d < bestDist){ bestDist = d; bestIdx = i; }
      });
      return { name: w.name, lat: w.lat, lon: w.lon, cumDist: cumDist[bestIdx] };
    }).sort((a,b) => a.cumDist - b.cumDist);

    // reset voice-announcement state for the new route
    wasOffRoute = false;
    lastOffRouteAnnounce = 0;
    announcedNear = new Set();
    announcedClose = new Set();
    announcedArrival = false;
    announcedTurnFar = new Set();
    announcedTurnNear = new Set();

    turnPoints = computeTurns();
    buildElevationProfile();

    // reset trip timer / recording state for the new route
    navStartTime = null;
    if(tripTimerInterval) clearInterval(tripTimerInterval);
    tripTimerInterval = null;
    recordedTrack = [];
    recordedDistance = 0;
    lastRecordedPoint = null;
    document.getElementById('statTime').textContent = '–';
    document.getElementById('statAvgSpeed').textContent = '–';
    document.getElementById('exportBtn').disabled = true;
    document.getElementById('tripSummary').classList.remove('show');
    document.getElementById('turnBanner').classList.remove('show');
    setMapBearing(0);

    // draw on map
    if(routeLayer) map.removeLayer(routeLayer);
    wptMarkers.forEach(m => map.removeLayer(m));
    wptMarkers = [];
    if(destMarker){ map.removeLayer(destMarker); destMarker = null; }

    const latlngs = trackPoints.map(p => [p.lat, p.lon]);
    routeLayer = L.polyline(latlngs, { color:'#4f9d69', weight:5, opacity:0.85 }).addTo(map);
    map.invalidateSize();
    programmaticZoom = true;
    map.fitBounds(routeLayer.getBounds(), { padding:[30,30] });
    programmaticZoom = false;

    waypoints.forEach(w => {
      const icon = L.divIcon({
        className:'', html:'<div class="wpt-pin"><span>●</span></div>',
        iconSize:[22,22], iconAnchor:[11,20]
      });
      const m = L.marker([w.lat, w.lon], { icon }).bindPopup(w.name).addTo(map);
      wptMarkers.push(m);
    });

    document.getElementById('mainDistance').textContent = fmtDist(totalDist);
    document.getElementById('mainDistanceLabel').textContent = 'Streckenlänge';
    document.getElementById('speedStat').style.display = 'none';

    document.getElementById('placeholder').classList.add('hide');
    document.getElementById('navContent').style.display = 'none';
    document.getElementById('routeHeader').classList.add('show');
    document.getElementById('routeSummary').classList.add('show');
    document.getElementById('offlineBtn').style.display = 'flex';
    document.getElementById('dashboard').classList.add('show');
  }

  // ---------- File input ----------
  document.getElementById('fileInput').addEventListener('change', function(e){
    const file = e.target.files[0];
    if(!file) return;
    document.getElementById('fileLabel').textContent = file.name;
    const reader = new FileReader();
    reader.onload = function(ev){
      try{
        const { points, waypoints } = parseGPX(ev.target.result);
        loadRoute(points, waypoints);
        hideBanner();
      }catch(err){
        showBanner('<strong>Fehler beim Einlesen:</strong> ' + err.message);
      }
    };
    reader.onerror = () => showBanner('<strong>Fehler:</strong> Datei konnte nicht gelesen werden.');
    reader.readAsText(file);
  });

  async function requestBRouterRoute(latlng){
    if(!lastFix){
      showBanner('<strong>Kein Standort:</strong> Warte, bis dein GPS-Standort ermittelt wurde, bevor du ein Ziel wählst.');
      return;
    }

    showBanner('Route wird berechnet…');
    try{
      const profile = document.getElementById('routeProfile').value;
      const url = 'https://brouter.de/brouter?lonlats=' +
        lastFix.lon + ',' + lastFix.lat + '|' + latlng.lng + ',' + latlng.lat +
        '&profile=' + profile + '&alternativeidx=0&format=gpx';
      const res = await fetch(url);
      if(!res.ok) throw new Error('Routing-Server antwortete mit Fehler ' + res.status);
      const gpxText = await res.text();
      const { points, waypoints } = parseGPX(gpxText);
      loadRoute(points, waypoints); // also clears any previous destination marker
      document.getElementById('fileLabel').textContent = 'Berechnete Route';

      const icon = L.divIcon({
        className:'', html:'<div class="wpt-pin" style="border-color:var(--warn-red); color:var(--warn-red);"><span>⚑</span></div>',
        iconSize:[22,22], iconAnchor:[11,20]
      });
      destMarker = L.marker([latlng.lat, latlng.lng], { icon }).addTo(map);
      hideBanner();
    }catch(err){
      showBanner('<strong>Route konnte nicht berechnet werden:</strong> ' + err.message);
    }
  }

  // ---------- Search & load a known named route (Waymarked Trails cycling API) ----------
  document.getElementById('namedRouteBtn').addEventListener('click', function(){
    document.getElementById('routeSearchPanel').classList.add('show');
    document.getElementById('routeSearchInput').focus();
  });
  document.getElementById('routeSearchCloseBtn').addEventListener('click', function(){
    document.getElementById('routeSearchPanel').classList.remove('show');
  });

  let routeSearchTimer = null;
  document.getElementById('routeSearchInput').addEventListener('input', function(){
    clearTimeout(routeSearchTimer);
    const query = this.value.trim();
    const resultsEl = document.getElementById('routeSearchResults');
    if(query.length < 3){ resultsEl.innerHTML = ''; return; }
    routeSearchTimer = setTimeout(() => searchNamedRoutes(query), 400);

  async function searchNamedRoutes(query){
    const resultsEl = document.getElementById('routeSearchResults');
    resultsEl.innerHTML = '<div class="route-search-status">Suche…</div>';
    try{
      const url = 'https://cycling.waymarkedtrails.org/api/v1/list/search?limit=8&query=' + encodeURIComponent(query);
      const res = await fetch(url);
      if(!res.ok) throw new Error('Fehler ' + res.status);
      const data = await res.json();
      if(!data.results || data.results.length === 0){
        resultsEl.innerHTML = '<div class="route-search-status">Keine Route gefunden.</div>';
        return;
      }
      resultsEl.innerHTML = '';
      data.results.forEach(r => {
        const item = document.createElement('div');
        item.className = 'route-search-item';
        const via = Array.isArray(r.itinerary) && r.itinerary.length ? r.itinerary.join(' – ') : '';
        item.innerHTML = '<span>' + r.name + (r.ref ? ' (' + r.ref + ')' : '') + '</span>' +
          (via ? '<span>' + via + '</span>' : '');
        item.addEventListener('click', () => loadNamedRoute(r.id, r.name));
        resultsEl.appendChild(item);
      });
    }catch(err){
      resultsEl.innerHTML = '<div class="route-search-status">Suche fehlgeschlagen: ' + err.message + '</div>';
    }
  }

  // The API returns geometry in Web Mercator (EPSG:3857) meters, not lat/lon.
  function webMercatorToLatLon(x, y){
    const R = 6378137;
    return {
      lon: (x / R) * 180 / Math.PI,
      lat: (2 * Math.atan(Math.exp(y / R)) - Math.PI / 2) * 180 / Math.PI
    };
  }

  async function loadNamedRoute(id, name){
    document.getElementById('routeSearchPanel').classList.remove('show');
    showBanner('Route wird geladen…');
    try{
      const res = await fetch('https://cycling.waymarkedtrails.org/api/v1/details/relation/' + id);
      if(!res.ok) throw new Error('Fehler ' + res.status);
      const data = await res.json();

      // The route tree mixes plain "linear" stretches with "split" sections (e.g. a
      // separated one-way pair); we follow the "forward" side of any split. Long routes
      // also get short, unrelated spur/alternate segments appended after the main line
      // (confirmed against the real Ruhrtalradweg data — segments 17+ jumped ~118km back
      // to the start). A real route can have legitimate gaps too (e.g. RS1's unfinished
      // sections, up to ~17km in the current data), so we only cut once a gap is far
      // beyond that — 30km comfortably separates "real gap" from "unrelated segment".
      const MAX_GAP_M = 30000;
      function collectSegmentCoords(seg, out){
        if(!seg) return;
        if(seg.route_type === 'linear' && seg.ways){
          seg.ways.forEach(w => {
            if(w.geometry && w.geometry.coordinates) out.push(...w.geometry.coordinates);
          });
        }else if(seg.route_type === 'split'){
          (seg.forward || seg.backward || []).forEach(s => collectSegmentCoords(s, out));
        }
      }
      const coords = [];
      const mainSegs = (data.route && data.route.main) || [];
      for(const seg of mainSegs){
        const segCoords = [];
        collectSegmentCoords(seg, segCoords);
        if(segCoords.length === 0) continue;
        if(coords.length > 0){
          const prevLL = webMercatorToLatLon(...coords[coords.length - 1]);
          const nextLL = webMercatorToLatLon(...segCoords[0]);
          if(haversine(prevLL, nextLL) > MAX_GAP_M) break;
        }
        coords.push(...segCoords);
      }
      if(coords.length < 2) throw new Error('Keine Streckendaten für diese Route gefunden.');

      const points = coords.map(([x, y]) => {
        const ll = webMercatorToLatLon(x, y);
        return { lat: ll.lat, lon: ll.lon, ele: null };
      });
      loadRoute(points, []);
      document.getElementById('fileLabel').textContent = name;
      hideBanner();
    }catch(err){
      showBanner('<strong>Route konnte nicht geladen werden:</strong> ' + err.message);
    }
  }

  // ---------- Navigation ----------
  document.getElementById('navToggleBtn').addEventListener('click', function(){
    if(navStartTime) stopNav(); else startNav();
  });

  // Show the rider's own position on the map as soon as the app opens, independent
  // of whether a route is loaded or "Navigation starten" was pressed.
  function startLocationWatch(){
    if(!navigator.geolocation || !window.isSecureContext || watchId !== null) return;
    watchId = navigator.geolocation.watchPosition(onPosition, onGeoError, {
      enableHighAccuracy:true, maximumAge:2000, timeout:15000
    });
  }
  startLocationWatch();

  function startNav(){
    if(!navigator.geolocation){
      showBanner('<strong>Kein GPS verfügbar:</strong> Dieser Browser unterstützt keine Standortermittlung.');
      return;
    }
    if(!window.isSecureContext){
      showBanner('<strong>GPS benötigt HTTPS:</strong> Standortzugriff funktioniert nur über eine sichere Verbindung. Lade diese Datei auf einen Webspace mit HTTPS (z.\u00a0B. GitHub Pages) hoch, um live zu navigieren.');
      return;
    }

    document.getElementById('routeSummary').classList.remove('show');
    document.getElementById('navContent').style.display = 'block';
    document.getElementById('mainDistanceLabel').textContent = 'Restdistanz';
    document.getElementById('speedStat').style.display = 'flex';
    document.getElementById('fileLabel').style.pointerEvents = 'none';
    document.getElementById('fileLabel').style.opacity = '0.5';
    document.body.classList.add('nav-active');
    const navToggleBtn = document.getElementById('navToggleBtn');
    navToggleBtn.textContent = 'Stop';
    navToggleBtn.classList.remove('nav-toggle-start');
    navToggleBtn.classList.add('nav-toggle-stop');
    enterFullscreen();
    requestWakeLock();
    setTimeout(() => map.invalidateSize(), 100);

    // jump straight to the current position at a navigation zoom level, instead of
    // waiting for the next GPS fix's regular (throttled) speed-adaptive zoom-in
    followMode = true;
    document.getElementById('followBtn').classList.add('active');
    if(lastFix){
      programmaticZoom = true;
      map.setView([lastFix.lat, lastFix.lon], computeNavZoom(null));
      programmaticZoom = false;
      lastZoomChange = Date.now();
    }

    navStartTime = Date.now();
    recordedTrack = [];
    recordedDistance = 0;
    lastRecordedPoint = null;
    document.getElementById('recordingInfo').textContent = 'Aufzeichnung: 0 m';
    document.getElementById('exportBtn').disabled = true;
    updateTripStats();
    tripTimerInterval = setInterval(updateTripStats, 1000);

    startLocationWatch(); // no-op if already running, otherwise (re)starts it
  }

  function stopNav(){
    navStartTime = null; // ends guidance/recording; the position watch itself keeps running
    if('speechSynthesis' in window) window.speechSynthesis.cancel();
    if(tripTimerInterval) clearInterval(tripTimerInterval);
    tripTimerInterval = null;
    document.getElementById('navContent').style.display = 'none';
    document.getElementById('routeSummary').classList.add('show');
    document.getElementById('mainDistanceLabel').textContent = 'Streckenlänge';
    document.getElementById('mainDistance').textContent = fmtDist(totalDist);
    document.getElementById('speedStat').style.display = 'none';
    document.getElementById('tripSummary').classList.add('show');
    document.getElementById('recordingRow').style.display = recordedTrack.length >= 2 ? 'flex' : 'none';
    document.getElementById('turnBanner').classList.remove('show');
    setMapBearing(0);
    document.getElementById('fileLabel').style.pointerEvents = 'auto';
    document.getElementById('fileLabel').style.opacity = '1';
    document.body.classList.remove('nav-active');
    const navToggleBtn = document.getElementById('navToggleBtn');
    navToggleBtn.textContent = 'Start';
    navToggleBtn.classList.remove('nav-toggle-stop');
    navToggleBtn.classList.add('nav-toggle-start');
    exitFullscreen();
    releaseWakeLock();
    setTimeout(() => map.invalidateSize(), 100);
  }

  function updateTripStats(){
    if(!navStartTime) return;
    const elapsedMs = Date.now() - navStartTime;
    document.getElementById('statTime').textContent = fmtDuration(elapsedMs);
    const hours = elapsedMs / 3600000;
    const avg = hours > 0 ? (recordedDistance / 1000) / hours : 0;
    document.getElementById('statAvgSpeed').textContent = avg.toFixed(1);
  }

  function onGeoError(err){
    const msgs = {
      1: 'Standortzugriff wurde verweigert. Bitte erlaube den Zugriff in den Browser-Einstellungen.',
      2: 'Standort konnte nicht ermittelt werden.',
      3: 'Zeitüberschreitung beim Ermitteln des Standorts.'
    };
    showBanner('<strong>GPS-Fehler:</strong> ' + (msgs[err.code] || err.message));
  }

  function onPosition(pos){
    hideBanner();
    const p = { lat: pos.coords.latitude, lon: pos.coords.longitude };
    const prevFix = lastFix; // kept for the heading fallback below
    lastFix = p;
    const kmh = pos.coords.speed != null ? (pos.coords.speed * 3.6) : null;

    // marker
    const heading = pos.coords.heading;
    let headingDeg = (heading !== null && !isNaN(heading)) ? heading : null;
    if(headingDeg == null && prevFix && haversine(prevFix, p) > 3){
      headingDeg = bearing(prevFix, p); // GPS course is often unavailable; derive it from movement
    }
    if(headingDeg != null) lastHeading = headingDeg;

    const html = (heading !== null && !isNaN(heading))
      ? `<div class="user-arrow" style="transform:rotate(${heading}deg)"></div>`
      : `<div class="user-dot"></div>`;
    const icon = L.divIcon({ className:'', html, iconSize:[20,20], iconAnchor:[10,10] });
    if(!userMarker){
      userMarker = L.marker([p.lat, p.lon], { icon, zIndexOffset:1000 }).addTo(map);
      map.invalidateSize();
    }else{
      userMarker.setLatLng([p.lat, p.lon]);
      userMarker.setIcon(icon);
    }

    // follow + speed-adaptive zoom (comfort feature)
    if(followMode){
      const targetZoom = computeNavZoom(kmh);
      const now2 = Date.now();
      if(Math.abs(targetZoom - map.getZoom()) >= 1 && now2 - lastZoomChange > 4000){
        programmaticZoom = true;
        map.setView([p.lat, p.lon], targetZoom);
        programmaticZoom = false;
        lastZoomChange = now2;
      }else{
        map.panTo([p.lat, p.lon]);
      }
      if(navStartTime) setMapBearing(lastHeading); // heading-up while actively navigating
    }

    document.getElementById('statSpeed').textContent = kmh != null ? kmh.toFixed(1) : '–';

    // marker + follow above run for every fix; guidance below only while navigating
    if(!navStartTime) return;

    // distance traveled (for the avg-speed stat) is tracked regardless; the actual
    // GPX point track is only kept if recording was opted into before starting
    const moved = lastRecordedPoint ? haversine(lastRecordedPoint, p) : Infinity;
    if(moved >= 3){
      recordedDistance += lastRecordedPoint ? moved : 0;
      lastRecordedPoint = p;
      if(recordingEnabled){
        recordedTrack.push({ lat:p.lat, lon:p.lon, ele: pos.coords.altitude, time: new Date().toISOString() });
        document.getElementById('recordingInfo').textContent = 'Aufzeichnung: ' + fmtDist(recordedDistance);
        document.getElementById('exportBtn').disabled = recordedTrack.length < 2;
      }
    }
    updateTripStats();

    if(trackPoints.length < 2) return;

    // progress along route
    const nearest = findNearestOnTrack(p);
    const remaining = totalDist - nearest.traveled;
    document.getElementById('mainDistance').textContent = fmtDist(remaining);

    // off-route
    const offBanner = document.getElementById('offRouteBanner');
    const now = Date.now();
    if(nearest.dist > 50){
      offBanner.classList.add('show');
      document.getElementById('offRouteDist').textContent = fmtDist(nearest.dist);
      if(!wasOffRoute){
        speak('Achtung, du bist ' + Math.round(nearest.dist) + ' Meter von der Route entfernt.');
        lastOffRouteAnnounce = now;
        wasOffRoute = true;
      }else if(now - lastOffRouteAnnounce > 45000){
        speak('Du bist weiterhin abseits der Route.');
        lastOffRouteAnnounce = now;
      }
    }else{
      offBanner.classList.remove('show');
      if(wasOffRoute) speak('Zurück auf der Route.');
      wasOffRoute = false;
    }

    // next turn: big arrow banner on the map + proximity voice ("in 100 Metern links abbiegen")
    const upcomingTurn = turnPoints.find(t => t.cumDist > nearest.traveled);
    const turnBanner = document.getElementById('turnBanner');
    if(upcomingTurn){
      const distTo = upcomingTurn.cumDist - nearest.traveled;
      document.getElementById('turnArrowIcon').style.transform = `rotate(${upcomingTurn.angle}deg)`;
      document.getElementById('turnBannerDist').textContent = fmtDist(distTo);
      document.getElementById('turnBannerLabel').textContent = upcomingTurn.label;
      turnBanner.classList.add('show');
      if(distTo <= 150 && !announcedTurnFar.has(upcomingTurn.cumDist)){
        announcedTurnFar.add(upcomingTurn.cumDist);
        speak('In ' + Math.round(distTo / 10) * 10 + ' Metern ' + upcomingTurn.label + ' abbiegen.');
      }
      if(distTo <= 30 && !announcedTurnNear.has(upcomingTurn.cumDist)){
        announcedTurnNear.add(upcomingTurn.cumDist);
        speak('Jetzt ' + upcomingTurn.label + '.');
      }
    }else{
      turnBanner.classList.remove('show');
    }

    // elevation profile marker
    if(elevProfile){
      const ele = elevationAt(nearest.traveled);
      const marker = document.getElementById('elevMarker');
      if(ele != null){
        const x = (nearest.traveled / totalDist) * elevProfile.w;
        const y = elevProfile.h - elevProfile.pad - ((ele - elevProfile.minE) / elevProfile.range) * (elevProfile.h - 2*elevProfile.pad);
        marker.setAttribute('cx', x.toFixed(1));
        marker.setAttribute('cy', y.toFixed(1));
        marker.style.display = 'block';
      }
    }

    // next waypoint + proximity voice
    const upcoming = matchedWpts.find(w => w.cumDist > nearest.traveled);
    const nextEl = document.getElementById('nextWpt');
    if(upcoming){
      const distTo = upcoming.cumDist - nearest.traveled;
      nextEl.innerHTML = 'Nächster Punkt: <b>' + upcoming.name + '</b> in ' + fmtDist(distTo);
      if(distTo <= 300 && !announcedNear.has(upcoming.name)){
        announcedNear.add(upcoming.name);
        speak('In 300 Metern: ' + upcoming.name);
      }
      if(distTo <= 50 && !announcedClose.has(upcoming.name)){
        announcedClose.add(upcoming.name);
        speak('Jetzt: ' + upcoming.name);
      }
    }else{
      nextEl.innerHTML = '&nbsp;';
    }

    if(remaining < 30 && !announcedArrival){
      announcedArrival = true;
      speak('Ziel erreicht.');
    }
  }

  // ---------- Offline map download (uses the service worker's tile cache) ----------
  const OFFLINE_ZOOM_MIN = 13;
  const OFFLINE_ZOOM_MAX = 16;
  let downloadCancelled = false;

  function lon2tileX(lon, z){ return Math.floor((lon + 180) / 360 * Math.pow(2, z)); }
  function lat2tileY(lat, z){
    const rad = lat * Math.PI / 180;
    return Math.floor((1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * Math.pow(2, z));
  }

  function routeBounds(){
    let minLat=90, maxLat=-90, minLon=180, maxLon=-180;
    trackPoints.forEach(p => {
      if(p.lat < minLat) minLat = p.lat;
      if(p.lat > maxLat) maxLat = p.lat;
      if(p.lon < minLon) minLon = p.lon;
      if(p.lon > maxLon) maxLon = p.lon;
    });
    const buf = 0.003; // ~300m buffer around the route
    return { minLat:minLat-buf, maxLat:maxLat+buf, minLon:minLon-buf, maxLon:maxLon+buf };
  }

  function buildTileList(){
    const b = routeBounds();
    const tiles = [];
    for(let z = OFFLINE_ZOOM_MIN; z <= OFFLINE_ZOOM_MAX; z++){
      const xMin = lon2tileX(b.minLon, z), xMax = lon2tileX(b.maxLon, z);
      const yMin = lat2tileY(b.maxLat, z), yMax = lat2tileY(b.minLat, z);
      for(let x = xMin; x <= xMax; x++){
        for(let y = yMin; y <= yMax; y++){
          const sub = ['a','b','c'][(x+y) % 3];
          tiles.push(`https://${sub}.tile.openstreetmap.org/${z}/${x}/${y}.png`);
        }
      }
    }
    return tiles;
  }

  function showDownloadPanel(){ document.getElementById('downloadPanel').classList.add('show'); }
  function hideDownloadPanel(){ document.getElementById('downloadPanel').classList.remove('show'); }
  function updateDownloadProgress(done, total){
    document.getElementById('downloadText').textContent = `Kacheln werden geladen… ${done} / ${total}`;
    document.getElementById('downloadBarFill').style.width = (total ? (done/total*100) : 0) + '%';
  }

  document.getElementById('offlineBtn').addEventListener('click', async function(){
    if(trackPoints.length < 2) return;

    if(!('serviceWorker' in navigator)){
      showBanner('<strong>Nicht unterstützt:</strong> Dieser Browser kann keine Offline-Karten speichern.');
      return;
    }
    if(!navigator.serviceWorker.controller){
      showBanner('<strong>Offline-Modus wird vorbereitet:</strong> Lade die Seite einmal komplett neu und versuche es danach erneut.');
      return;
    }

    const tiles = buildTileList();
    const estMB = (tiles.length * 20 / 1024).toFixed(1);
    const proceed = confirm(`Karte für die Route herunterladen?\n\n${tiles.length} Kacheln, ca. ${estMB} MB.\nKann je nach Verbindung einige Minuten dauern.`);
    if(!proceed) return;

    downloadCancelled = false;
    showDownloadPanel();
    updateDownloadProgress(0, tiles.length);

    let idx = 0, done = 0, failed = 0;
    async function worker(){
      while(idx < tiles.length){
        if(downloadCancelled) return;
        const url = tiles[idx++];
        try{ await fetch(url, { mode:'no-cors' }); }
        catch(e){ failed++; }
        done++;
        updateDownloadProgress(done, tiles.length);
        await new Promise(r => setTimeout(r, 30));
      }
    }

    await Promise.all(Array.from({length:6}, worker));

    if(!downloadCancelled){
      hideDownloadPanel();
      showBanner(`<strong>Fertig:</strong> Karte für die Route ist offline verfügbar (${tiles.length - failed} von ${tiles.length} Kacheln).`);
      setTimeout(hideBanner, 6000);
    }
  });

  document.getElementById('cancelDownloadBtn').addEventListener('click', function(){
    downloadCancelled = true;
    hideDownloadPanel();
  });

  // ---------- GPX export of the recorded track ----------
  function exportRecordedGPX(){
    if(recordedTrack.length < 2) return;
    const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const trkpts = recordedTrack.map(pt => {
      const ele = (pt.ele != null && !isNaN(pt.ele)) ? '<ele>' + pt.ele.toFixed(1) + '</ele>' : '';
      return '<trkpt lat="' + pt.lat + '" lon="' + pt.lon + '">' + ele + '<time>' + esc(pt.time) + '</time></trkpt>';
    }).join('\n');

    const gpx = '<?xml version="1.0" encoding="UTF-8"?>\n' +
      '<gpx version="1.1" creator="Rad-Navi" xmlns="http://www.topografix.com/GPX/1/1">\n' +
      '<trk><name>Rad-Navi Aufzeichnung ' + esc(new Date().toLocaleString('de-DE')) + '</name><trkseg>\n' +
      trkpts + '\n</trkseg></trk>\n</gpx>\n';

    const blob = new Blob([gpx], { type:'application/gpx+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'rad-navi-' + new Date().toISOString().slice(0,19).replace(/[:T]/g,'-') + '.gpx';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }
  document.getElementById('exportBtn').addEventListener('click', exportRecordedGPX);

})();
</script>
